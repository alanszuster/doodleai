services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Local development only. The legacy static key is off by default; production
      # authenticates with Vercel OIDC tokens (see the README).
      - AUTH_ALLOW_API_KEY=true
      - AI_API_KEY=${AI_API_KEY:-dev-key}
    volumes:
      - ../model/artifacts:/app/model/artifacts:ro
    healthcheck:
      # /health is public and needs no credentials (same probe as the Dockerfile)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
