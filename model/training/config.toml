# Single source of truth for dataset preparation and training.
# Paths are relative to the repository root unless absolute.

[data]
classes_file = "model/artifacts/classes.json"   # index -> class name; fixes the label order
samples_per_class = 30000    # recognized drawings used per class (train + val + test)
val_per_class = 500
test_per_class = 1000
image_size = 64              # side of the model input in pixels
seed = 42

[render]
# Mirrors renderForModel() in the website (AIPlaygroundSection.tsx): the drawing is
# cropped to its bounding box, centred and scaled onto a canvas x canvas image with a
# fixed margin and stroke width, then shrunk to image_size the same way the API does.
canvas = 280
margin = 25
line_width = 22
min_extent = 10              # Quick Draw coordinates are 0..255; avoids blowing up dots
line_width_jitter = 6        # training images only: stroke width varies by +/- this

[train]
batch_size = 512
time_budget_hours = 9.5      # train as long as fits: the epochs are chosen from the measured step
                             # time. A Kaggle session lasts 12 h; ~1 h goes to data preparation and
                             # a little to evaluation. --epochs on the command line overrides this.
epochs = 16                  # used only when time_budget_hours is not set (an epoch is ~55 min in
                             # fp32 on Kaggle's T4 x2, ~30 min in fp16)
learning_rate = 0.001        # 0.002 diverged to NaN in epoch 2 of the first full run
clipnorm = 1.0               # global gradient-norm clip; keeps one bad batch from wrecking the weights
weight_decay = 0.01
label_smoothing = 0.1
warmup_epochs = 1
dropout = 0.3
widths = [32, 64, 128, 256]  # channels per stage
blocks = [2, 2, 2, 2]        # residual blocks per stage
stem_stride = 1             # 2 makes every stage 4x cheaper (then widths can double)
mixed_precision = false      # fp16 went NaN twice in epoch 2 (runs 20261112/13), so fp32 is the safe default;
                             # what that costs in speed is not measured yet (the input pipeline is not the limit)
shuffle_chunk = 8192         # rows read from disk at a time (data is pre-shuffled)
shuffle_buffer = 20000

[augment]
rotation = 0.04              # fraction of a full turn (0.04 = +/- 14 degrees)
translation = 0.05
zoom = 0.1

[promotion]
# A new model may replace the one in production only if, on the very same test set, it
# beats it by at least `margin` top-1 (test noise is about +/-0.15 points), no class gets
# clearly worse and calibration does not get clearly worse.
margin = 0.005               # 0.5 percentage points of top-1
max_class_drop = 0.03        # no class may lose more than 3 points of accuracy
max_ece_rise = 0.03
