name: Release

# Keeps a "release PR" up to date from the Conventional Commits on main (feat: -> minor,
# fix: -> patch, feat!: / BREAKING CHANGE -> major). Merging it creates the tag vX.Y.Z and a
# GitHub Release with the changelog. Deploys are separate (deploy-hf.yml, on every push to
# main) and stamp the exact `git describe` of what they ship, so /health always tells the truth.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags and the GitHub Release
      pull-requests: write # the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
